<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Muhammad Ibrahim Zia</title>
  <meta name="description" content="Contact Muhammad Ibrahim Zia about AI projects, space and energy engineering, or collaboration.">
  <link rel="icon" href="assets/iz-removebg-preview1.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">M. Ibrahim Zia</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">Bio</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Contact</h1>
    <p style="margin-top:1rem">
      Send a message below, or reach me directly at
      <a href="mailto:ibrahim.mzia@gmail.com">ibrahim.mzia@gmail.com</a>.
    </p>
    <ul class="links">
      <li><a href="https://www.linkedin.com/in/mibrahimzia/" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://github.com/mibrahimzia" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.instagram.com/ibrahim.mzia" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.youtube.com/@Muhammad-Ibrahim-Zia" target="_blank" rel="noopener">YouTube</a></li>
    </ul>

    <form id="contactForm" novalidate>
      <label>Name
        <input type="text" id="name" name="name" required autocomplete="name">
      </label>
      <label>Email
        <input type="email" id="email" name="email" required autocomplete="email">
      </label>
      <label>Message
        <textarea id="message" name="message" required></textarea>
      </label>
      <!-- Honeypot: real people never fill this in -->
      <input class="hp" type="text" id="website" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" id="sendBtn">Send message</button>
      <p id="formStatus" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="wrap">&copy; <span id="year">2026</span> Muhammad Ibrahim Zia</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
